name: Auth0 recovery monitor
# Manual activation until the receiver and external HTTP monitor are verified.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-auth0-recovery-monitor
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'kiwanukaphil-oss/media-sharing-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: relay-backup-copy
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Inspect provider failures and reconcile known reset timestamps without writes
        id: provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          AUTH0_MONITOR_CLIENT_ID: ${{ secrets.AUTH0_MONITOR_CLIENT_ID }}
          AUTH0_MONITOR_CLIENT_SECRET: ${{ secrets.AUTH0_MONITOR_CLIENT_SECRET }}
        run: node --disable-warning=ExperimentalWarning scripts/check-auth0-recovery.mjs
      - name: Inspect the identity review queue and recorded session consistency
        id: identity
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: node --disable-warning=ExperimentalWarning scripts/check-identity-operations.mjs
      - name: Report combined health without private diagnostics
        if: always()
        env:
          RELAY_MONITOR_SECRET: ${{ secrets.RELAY_MONITOR_SECRET }}
          IDENTITY_CHECK_OUTCOME: ${{ steps.identity.outcome }}
          PROVIDER_CHECK_OUTCOME: ${{ steps.provider.outcome }}
        run: node scripts/report-identity-health.mjs
