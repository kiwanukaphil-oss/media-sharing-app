name: Auth0 recovery monitor
# Manual activation only until dedicated read-only provider access and alert delivery are verified.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-auth0-recovery-monitor
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'kiwanukaphil-oss/media-sharing-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: relay-backup-copy
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Inspect provider failures and reconcile known reset timestamps without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          AUTH0_MONITOR_CLIENT_ID: ${{ secrets.AUTH0_MONITOR_CLIENT_ID }}
          AUTH0_MONITOR_CLIENT_SECRET: ${{ secrets.AUTH0_MONITOR_CLIENT_SECRET }}
        run: node --disable-warning=ExperimentalWarning scripts/check-auth0-recovery.mjs
