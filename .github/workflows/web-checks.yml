name: Web checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node tests/download-integrity.mjs
      # Clean checkouts default to the portable execution profile; no machine-local settings are needed.
      - run: npm run build
      - run: node scripts/ci-web-integration.mjs
