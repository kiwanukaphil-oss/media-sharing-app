name: Web checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint:web
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node tests/download-integrity.mjs
      - run: node tests/backup-download-errors.mjs
      - run: node tests/library-polling.mjs
      - run: node tests/capture-date.mjs
      - run: node tests/preparation-progress.mjs
      - run: node tests/preview-lifecycle.mjs
      - run: node tests/album-section-migration.mjs
      - run: node tests/favorites-migration.mjs
      - run: node tests/personal-favorites.mjs
      - run: node tests/activity-migration.mjs
      - run: node tests/library-activity.mjs
      - run: node tests/metadata-export.mjs
      - run: node tests/folder-import.mjs
      - run: node tests/import-layout.mjs
      - run: node tests/invitation-role-migration.mjs
      - run: node tests/identity-migration.mjs
      - run: node tests/identity-runtime.mjs
      - run: node --disable-warning=ExperimentalWarning tests/identity-operations.mjs
      - run: node --disable-warning=ExperimentalWarning tests/account-erasure-plan.mjs
      - run: node tests/account-closure-fence.mjs
      - run: node tests/upload-signing-custody.mjs
      - run: node tests/library-write-authority.mjs
      - run: node tests/account-metadata-authority.mjs
      - run: node tests/backup-closure-coordination.mjs
      - run: node tests/backup-closure-client.mjs
      - run: node tests/backup-completion-receipt.mjs
      - run: node tests/backup-completion-inspection.mjs
      - run: node --disable-warning=ExperimentalWarning tests/restored-backup-runs.mjs
      - run: node tests/provider-erasure-rehearsal.mjs
      - run: node tests/backup-version-inventory.mjs
      - run: node tests/erasure-ledger.mjs
      - run: node --disable-warning=ExperimentalWarning tests/erasure-ledger-journal.mjs
      - run: node --disable-warning=ExperimentalWarning tests/erasure-ledger-archive.mjs
      - run: node --disable-warning=ExperimentalWarning tests/erasure-ledger-bootstrap.mjs
      - run: node --disable-warning=ExperimentalWarning tests/erasure-intents.mjs
      - run: node --disable-warning=ExperimentalWarning tests/erasure-intent-publication.mjs
      - run: node tests/erasure-signing-vault.mjs
      - run: node tests/erasure-custody-handoff.mjs
      - run: node --disable-warning=ExperimentalWarning tests/legacy-erased-snapshot.mjs
      - run: node --disable-warning=ExperimentalWarning tests/legacy-erasure-evidence.mjs
      - run: node --disable-warning=ExperimentalWarning tests/historical-snapshot-inventory.mjs
      - run: node --disable-warning=ExperimentalWarning tests/closure-snapshot-inventory.mjs
      - run: node tests/closure-disposition.mjs
      - run: node tests/collaboration-policy.mjs
      - run: node tests/asset-scope-policy.mjs
      - run: node --disable-warning=ExperimentalWarning tests/asset-scope-authority.mjs
      - run: node tests/scope-management.mjs
      - run: node tests/upload-request-authority.mjs
      - run: node tests/intake-verification.mjs
      - run: node --disable-warning=ExperimentalWarning tests/intake-lifecycle.mjs
      - run: node --disable-warning=ExperimentalWarning tests/intake-migration.mjs
      - run: node --disable-warning=ExperimentalWarning tests/restricted-migration.mjs
      - run: node --disable-warning=ExperimentalWarning tests/delivery-authority.mjs
      - run: node --disable-warning=ExperimentalWarning tests/delivery-lifecycle.mjs
      - run: node --disable-warning=ExperimentalWarning tests/delivery-migration.mjs
      - run: node tests/original-package.mjs
      - run: node tests/saved-library-views.mjs
      - run: node --disable-warning=ExperimentalWarning tests/erased-snapshot.mjs
      - run: node tests/erasure-rehearsal-scope.mjs
      - run: node tests/scheduled-identity-monitor.mjs
      - run: node tests/monitor-json.mjs
      - run: node tests/r2-object-inventory.mjs
      - run: node tests/live-object-reconciliation.mjs
      - run: node tests/operations-health.mjs
      - run: node tests/publication-rehearsal.mjs
      - run: node tests/auth0-client.mjs
      - run: node tests/auth0-recovery-actions.mjs
      - run: node --disable-warning=ExperimentalWarning tests/auth0-recovery-monitor.mjs
      - run: node tests/device-role-migration.mjs
      - run: node tests/owner-recovery-preparation.mjs
      # Clean checkouts default to the portable execution profile; no machine-local settings are needed.
      - run: npm run build
      - run: node scripts/ci-web-integration.mjs
      - run: node scripts/ci-web-integration.mjs --account-access
      - run: node scripts/ci-web-integration.mjs --restricted-scopes --closure-tracking
      - run: node scripts/ci-web-integration.mjs --intake --closure-tracking
      - run: node scripts/ci-web-integration.mjs --deliveries --closure-tracking
      - run: node scripts/ci-web-integration.mjs --closure-tracking
      - run: node scripts/ci-web-integration.mjs --backup-coordination
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - run: npm run build
      - run: node scripts/ci-web-integration.mjs --browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolated-browser-failure
          path: .sites-runtime/browser-results/*-failure.*
          retention-days: 7
          if-no-files-found: ignore
